[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rules-generator"
version = "1.0.0"
description = "Structure-only codebase context maps (definitions/references) plus optional Cursor rules"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "AI Rules Generator Contributors"}
]
keywords = ["cursor", "ai", "rules", "code-generation", "coding-assistant", "repo-map"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    # Sole runtime dependency: grammars + tree-sitter bindings.
    # networkx is optional (PageRank); in-degree ranking is the fallback.
    "tree-sitter-language-pack>=0.2.0",
]

[project.optional-dependencies]
rank = ["networkx>=3.0"]
dev = ["pytest>=7.0", "networkx>=3.0"]

[project.scripts]
ai-rules-generator = "ai_rules_generator:main"
ai-rules = "ai_rules_generator:main"

[project.urls]
Homepage = "https://github.com/rpupo63/ai-rules-generator"
Documentation = "https://github.com/rpupo63/ai-rules-generator#readme"
Repository = "https://github.com/rpupo63/ai-rules-generator"
Issues = "https://github.com/rpupo63/ai-rules-generator/issues"

[tool.setuptools]
packages = ["ai_rules_generator"]
include-package-data = true

[tool.setuptools.package-data]
ai_rules_generator = [
    "queries/**/*",
]
