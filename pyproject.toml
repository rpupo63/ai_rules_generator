[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rules-generator"
version = "1.0.0"
description = "Complementary codebase context provider (What/How/Why) for any LLM, plus optional legacy AI coding agent rules"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "AI Rules Generator Contributors"}
]
keywords = ["cursor", "claude", "ai", "rules", "code-generation", "coding-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "ai-model-picker>=0.2.0",
    # Phase 3 - AST compression (Tree-sitter).  `tree-sitter-language-pack`
    # is preferred for Python 3.12+ wheel coverage; `tree-sitter-languages`
    # is accepted as a fallback at runtime.
    "tree-sitter>=0.21",
    "tree-sitter-language-pack>=0.2.0; python_version >= '3.9'",
    # Phase 4 - Graph RAG (DKB).  PageRank lives in networkx.
    "networkx>=3.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
google = ["google-generativeai>=0.3.0"]
mistral = ["mistralai>=0.1.0"]
cohere = ["cohere>=5.0.0"]
alibaba = ["dashscope>=1.0.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "mistralai>=0.1.0",
    "cohere>=5.0.0",
    "dashscope>=1.0.0",
]

[project.scripts]
ai-rules-generator = "ai_rules_generator:main"
ai-rules = "ai_rules_generator:main"

[project.urls]
Homepage = "https://github.com/rpupo63/ai-rules-generator"
Documentation = "https://github.com/rpupo63/ai-rules-generator#readme"
Repository = "https://github.com/rpupo63/ai-rules-generator"
Issues = "https://github.com/rpupo63/ai-rules-generator/issues"

[tool.setuptools]
packages = ["ai_rules_generator"]
include-package-data = true

[tool.setuptools.package-data]
ai_rules_generator = [
    "awesome-cursorrules/**/*",
    "ai_general_guidelines.md",
]

